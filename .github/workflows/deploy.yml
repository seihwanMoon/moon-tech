name: Validate and deploy moon's tech

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install Quartz dependencies
        run: npm ci

      - name: Install Source Note component dependencies
        run: npm ci --prefix plugins/source-note-brief

      - name: Verify Source Note component package
        run: npm run verify:package --prefix plugins/source-note-brief

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Check Quartz types and formatting
        run: npm run check

      - name: Check Source Note component
        run: npm run check --prefix plugins/source-note-brief

      - name: Run Quartz and validator tests
        run: npm test

      - name: Validate published Source Notes
        run: npm run validate:sources

      - name: Build Quartz site
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
